plugins {
    id 'com.android.application'
}

// Where the app points, taken from -PvaaniUrl or gradle.properties.
def vaaniUrl = (project.findProperty('vaaniUrl') ?: 'https://vaanitrack.vercel.app').toString().replaceAll('/+$', '')
def vaaniHost = new URI(vaaniUrl).host

// The signing key lives beside this file and is never committed. Without it
// the release build is unsigned and will not install.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

// Android does not resolve a string reference inside a shortcut's data
// attribute (it registers as an empty address), so the shortcut file is
// written at build time with the real address in it.
def generatedRes = layout.buildDirectory.dir('generated/vaaniRes').get().asFile
tasks.register('generateShortcuts') {
    def out = new File(generatedRes, 'xml/shortcuts.xml')
    inputs.property('url', vaaniUrl)
    outputs.file(out)
    doLast {
        out.parentFile.mkdirs()
        out.text = """<?xml version="1.0" encoding="utf-8"?>
<!-- Generated. Long-press the app icon: the same one-tap way in as the tile. -->
<shortcuts xmlns:android="http://schemas.android.com/apk/res/android">
    <shortcut
        android:enabled="true"
        android:icon="@drawable/ic_shortcut_record"
        android:shortcutId="record"
        android:shortcutLongLabel="@string/shortcut_long"
        android:shortcutShortLabel="@string/shortcut_short">
        <intent
            android:action="android.intent.action.VIEW"
            android:data="${vaaniUrl}/app?record=1"
            android:targetClass="com.google.androidbrowserhelper.trusted.LauncherActivity"
            android:targetPackage="app.vaanitrack.android" />
    </shortcut>
</shortcuts>
"""
    }
}
preBuild.dependsOn 'generateShortcuts'

android {
    namespace 'app.vaanitrack.android'
    compileSdk 34

    defaultConfig {
        applicationId 'app.vaanitrack.android'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'

        manifestPlaceholders = [vaaniHost: vaaniHost]
        // The one address, spelled once and used in three places: the launch
        // URL, the widget's tap target, and the site this app vouches for.
        resValue 'string', 'vaani_record_url', "${vaaniUrl}/app?record=1"
        resValue 'string', 'vaani_open_url', "${vaaniUrl}/app"
        resValue 'string', 'vaani_type_url', "${vaaniUrl}/app?type=1"
        resValue 'string', 'vaani_journal_url', "${vaaniUrl}/journal?from=widget"
        resValue 'string', 'vaani_insights_url', "${vaaniUrl}/insights"
        resValue 'string', 'asset_statements',
                '[{\\"relation\\": [\\"delegate_permission/common.handle_all_urls\\"], \\"target\\": {\\"namespace\\": \\"web\\", \\"site\\": \\"' + vaaniUrl + '\\"}}]'
    }

    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    sourceSets {
        main {
            res.srcDir generatedRes
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Trusted Web Activity: shows the website full screen, as an app.
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
