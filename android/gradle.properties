org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# Which VaaniTrack the app opens. Override per build, e.g.
#   gradlew assembleRelease -PvaaniUrl=https://your-preview.vercel.app
# The address must serve /.well-known/assetlinks.json naming this app's
# signing key, or Android shows a browser bar instead of full screen.
vaaniUrl=https://vaanitrack.vercel.app
